<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SmartSpend - Add Expense</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

<div class="app">


    <aside class="sidebar">

        <h2 class="brand-logo">
    <span class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none"
             xmlns="http://www.w3.org/2000/svg">

            <path d="M3 6.5A2.5 2.5 0 0 1 5.5 4H20"
                  stroke="white"
                  stroke-width="2"
                  stroke-linecap="round"/>

            <path d="M3 6.5V18a2 2 0 0 0 2 2h15V7H5.5A2.5 2.5 0 0 1 3 6.5Z"
                  stroke="white"
                  stroke-width="2"
                  stroke-linejoin="round"/>

            <path d="M16 12h4v4h-4a2 2 0 0 1 0-4Z"
                  stroke="white"
                  stroke-width="2"/>

            <circle cx="17" cy="14" r="0.7" fill="white"/>

        </svg>
    </span>

    <span>SmartSpend</span>
</h2>

        <a href="dashboard.html">
            🏠 Dashboard
        </a>

        <a class="active"
           href="add-expense.html">
            ➕ Add Expense
        </a>

        <a href="history.html">
            📋 History
        </a>

        <a href="budget.html">
            💰 Budget
        </a>

        <a href="reports.html">
            📊 Reports
        </a>

        <button
            class="logout-btn"
            onclick="logout()">
            Logout
        </button>

    </aside>


    <main class="main-content">

        <h1>Add Expense</h1>

        <p class="subtitle">
            Record your daily expenses easily.
        </p>


        <div class="form-box">

            <form onsubmit="addExpense(event)">


                <label>
                    Amount (₹)
                </label>

                <input
                    type="number"
                    id="amount"
                    placeholder="Enter amount"
                    min="0.01"
                    step="0.01"
                    required
                >


                <label>
                    Category
                </label>

                <select id="category"
                        required>

                    <option value="">
                        Select Category
                    </option>

                    <option>Food</option>

                    <option>Transport</option>

                    <option>Entertainment</option>

                    <option>Shopping</option>

                    <option>Education</option>

                    <option>Utilities</option>

                    <option>Other</option>

                </select>


                <label>
                    Date
                </label>

                <input
                    type="date"
                    id="expenseDate"
                    required
                >


                <label>
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Add a description">
                </textarea>


                <label>
                    Payment Method
                </label>

                <select
                    id="paymentMethod"
                    required>

                    <option value="">
                        Select Payment Method
                    </option>

                    <option>Cash</option>

                    <option>UPI</option>

                    <option>Debit Card</option>

                    <option>Credit Card</option>

                    <option>Net Banking</option>

                </select>


                <button
                    type="submit"
                    class="primary-btn">

                    Save Expense

                </button>


            </form>

        </div>

    </main>

</div>


<script src="script.js"></script>


<script>

    document.getElementById(
        "expenseDate"
    ).value =
        new Date()
        .toISOString()
        .split("T")[0];

</script>

</body>

</html>
