<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SmartSpend - Reports</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

<div class="app">


    <aside class="sidebar">

        <h2 class="brand-logo">
    <span class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none"
             xmlns="http://www.w3.org/2000/svg">

            <path d="M3 6.5A2.5 2.5 0 0 1 5.5 4H20"
                  stroke="white"
                  stroke-width="2"
                  stroke-linecap="round"/>

            <path d="M3 6.5V18a2 2 0 0 0 2 2h15V7H5.5A2.5 2.5 0 0 1 3 6.5Z"
                  stroke="white"
                  stroke-width="2"
                  stroke-linejoin="round"/>

            <path d="M16 12h4v4h-4a2 2 0 0 1 0-4Z"
                  stroke="white"
                  stroke-width="2"/>

            <circle cx="17" cy="14" r="0.7" fill="white"/>

        </svg>
    </span>

    <span>SmartSpend</span>
</h2>
        <a href="dashboard.html">
            🏠 Dashboard
        </a>

        <a href="add-expense.html">
            ➕ Add Expense
        </a>

        <a href="history.html">
            📋 History
        </a>

        <a href="budget.html">
            💰 Budget
        </a>

        <a class="active"
           href="reports.html">
            📊 Reports
        </a>

        <button
            class="logout-btn"
            onclick="logout()">
            Logout
        </button>

    </aside>


    <main class="main-content">

        <h1>Reports & Analytics</h1>

        <p class="subtitle">
            Understand your spending patterns.
        </p>


        <div class="cards">


            <div class="card">

                <h3>
                    Total Expenses
                </h3>

                <h2 id="reportTotal">
                    ₹0
                </h2>

            </div>


            <div class="card">

                <h3>
                    Total Transactions
                </h3>

                <h2 id="reportCount">
                    0
                </h2>

            </div>

        </div>


        <div class="section-box">

            <h2>
                Category-wise Spending
            </h2>

            <br>

            <div style="max-width: 450px; height: 350px; margin: auto;">
    <canvas id="categoryChart"></canvas>
</div>

<div id="categoryReport"></div>

        </div>

    </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

<script>
    loadReports();
</script>

</body>

</html>
