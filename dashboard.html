<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SmartSpend - Dashboard</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

<div class="app">


    <aside class="sidebar">
<h2 class="brand-logo">
    <span class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none"
             xmlns="http://www.w3.org/2000/svg">
            <path d="M3 6.5A2.5 2.5 0 0 1 5.5 4H20"
                  stroke="white" stroke-width="2"
                  stroke-linecap="round"/>
            <path d="M3 6.5V18a2 2 0 0 0 2 2h15V7H5.5A2.5 2.5 0 0 1 3 6.5Z"
                  stroke="white" stroke-width="2"
                  stroke-linejoin="round"/>
            <path d="M16 12h4v4h-4a2 2 0 0 1 0-4Z"
                  stroke="white" stroke-width="2"/>
            <circle cx="17" cy="14" r="0.7" fill="white"/>
        </svg>
    </span>
    <span>SmartSpend</span>
</h2>

        <a class="active"
           href="dashboard.html">
            🏠 Dashboard
        </a>

        <a href="add-expense.html">
            ➕ Add Expense
        </a>

        <a href="history.html">
            📋 History
        </a>

        <a href="budget.html">
            💰 Budget
        </a>

        <a href="reports.html">
            📊 Reports
        </a>

        <button
            class="logout-btn"
            onclick="logout()">
            Logout
        </button>

    </aside>


    <main class="main-content">

        <h1>Dashboard</h1>

        <p id="welcomeText"
           class="subtitle">
            Welcome to SmartSpend!
        </p>


        <div class="cards">


            <div class="card income-card">

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h3 style="margin-bottom: 0;">Total Income</h3>
                    <button onclick="updateIncomePrompt()" style="background: #16a34a; color: white; border: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;">Edit</button>
                </div>

                <h2 id="dashboardIncome">₹50,000</h2>

            </div>


            <div class="card expense-card">

                <h3>Total Expenses</h3>

                <h2 id="dashboardExpense">
                    ₹0
                </h2>

            </div>


            <div class="card balance-card">

                <h3>Available Balance</h3>

                <h2 id="dashboardBalance">
                    ₹50,000
                </h2>

            </div>

        </div>


        <div class="section-box">

            <div class="section-heading">

                <h2>
                    Recent Transactions
                </h2>

                <a href="history.html">
                    View All
                </a>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Date</th>

                            <th>Category</th>

                            <th>Description</th>

                            <th>Payment</th>

                            <th>Amount</th>

                        </tr>

                    </thead>


                    <tbody
                        id="recentTransactions">
                    </tbody>

                </table>

            </div>

        </div>
          </div>

    <div class="section-box">
        <h2>Monthly Spending Trend</h2>
        <br>

        <div style="width: 100%; max-width: 750px; height: 350px; margin: auto;">
            <canvas id="monthlySpendingChart"></canvas>
        </div>
    </div>

    </main>

    </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="script.js"></script>

<script>
    loadDashboard();
    loadMonthlySpendingChart();
</script>

</body>

</html>
